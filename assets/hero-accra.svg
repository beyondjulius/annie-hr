<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract Accra skyline and systems grid">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1a4a3c"/>
      <stop offset="55%" stop-color="#0f2c24"/>
      <stop offset="100%" stop-color="#081814"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.7" y1="0.2" x2="0.4" y2="0.9">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="280" r="220" fill="url(#glow)"/>
  <!-- distant coast light -->
  <ellipse cx="900" cy="720" rx="700" ry="90" fill="#0a1f19" opacity="0.55"/>
  <!-- building planes suggesting Accra densification -->
  <g fill="#143a30" opacity="0.9">
    <rect x="180" y="420" width="70" height="320"/>
    <rect x="270" y="360" width="90" height="380"/>
    <rect x="380" y="470" width="55" height="270"/>
    <rect x="460" y="330" width="110" height="410"/>
    <rect x="590" y="400" width="75" height="340"/>
    <rect x="690" y="290" width="130" height="450"/>
    <rect x="840" y="380" width="80" height="360"/>
    <rect x="940" y="250" width="150" height="490"/>
    <rect x="1110" y="360" width="95" height="380"/>
    <rect x="1225" y="430" width="70" height="310"/>
    <rect x="1320" y="320" width="120" height="420"/>
  </g>
  <g fill="#1c5244" opacity="0.75">
    <rect x="220" y="500" width="40" height="240"/>
    <rect x="510" y="390" width="45" height="350"/>
    <rect x="760" y="350" width="50" height="390"/>
    <rect x="1000" y="300" width="55" height="440"/>
    <rect x="1280" y="450" width="40" height="290"/>
  </g>
  <!-- window rhythm = systems / records metaphor -->
  <g fill="#c9a227" opacity="0.22">
    <g transform="translate(285 390)">
      <rect width="8" height="10"/><rect x="16" width="8" height="10"/><rect x="32" width="8" height="10"/>
      <rect y="22" width="8" height="10"/><rect x="16" y="22" width="8" height="10"/><rect x="32" y="22" width="8" height="10"/>
      <rect y="44" width="8" height="10"/><rect x="16" y="44" width="8" height="10"/><rect x="32" y="44" width="8" height="10"/>
      <rect y="66" width="8" height="10"/><rect x="16" y="66" width="8" height="10"/>
    </g>
    <g transform="translate(720 320)">
      <rect width="10" height="12"/><rect x="20" width="10" height="12"/><rect x="40" width="10" height="12"/><rect x="60" width="10" height="12"/>
      <rect y="26" width="10" height="12"/><rect x="20" y="26" width="10" height="12"/><rect x="40" y="26" width="10" height="12"/><rect x="60" y="26" width="10" height="12"/>
      <rect y="52" width="10" height="12"/><rect x="20" y="52" width="10" height="12"/><rect x="40" y="52" width="10" height="12"/>
      <rect y="78" width="10" height="12"/><rect x="20" y="78" width="10" height="12"/><rect x="60" y="78" width="10" height="12"/>
    </g>
    <g transform="translate(970 280)">
      <rect width="12" height="14"/><rect x="24" width="12" height="14"/><rect x="48" width="12" height="14"/><rect x="72" width="12" height="14"/>
      <rect y="30" width="12" height="14"/><rect x="24" y="30" width="12" height="14"/><rect x="48" y="30" width="12" height="14"/><rect x="72" y="30" width="12" height="14"/>
      <rect y="60" width="12" height="14"/><rect x="24" y="60" width="12" height="14"/><rect x="72" y="60" width="12" height="14"/>
      <rect y="90" width="12" height="14"/><rect x="48" y="90" width="12" height="14"/><rect x="72" y="90" width="12" height="14"/>
    </g>
  </g>
  <!-- horizon rule -->
  <rect x="0" y="738" width="1600" height="2" fill="#c9a227" opacity="0.35"/>
  <rect x="0" y="740" width="1600" height="260" fill="#071612"/>
</svg>
